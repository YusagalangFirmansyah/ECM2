<%@page language="abap"%>
<!-- Viewer Header -->
<div class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
  <div class="max-w-[1600px] mx-auto px-8 py-3 flex items-center justify-between">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #059669, #047857);">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
      </div>
      <div>
        <div class="text-sm font-bold text-slate-800">ECM Viewer</div>
        <div class="text-[0.65rem] text-slate-400">PT. Kayu Mebel Indonesia</div>
      </div>
    </div>

    <!-- Nav Links -->
    <div class="flex items-center gap-2">
      <a href="viewer_list.htm?u=<%= gv_user_id %>&r=<%= gv_role %>&n=<%= gv_full_name %>"
         class="px-3 py-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition-colors">
        ECR Monitor</a>
      <a href="dms_list.htm?u=<%= gv_user_id %>&r=<%= gv_role %>&n=<%= gv_full_name %>"
         class="px-3 py-1.5 text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-lg border border-emerald-200 hover:bg-emerald-100 transition-colors">
        DMS List
      </a>
    </div>

    <!-- Right: Date + User -->
    <div class="flex items-center gap-4">
      <div class="text-[0.7rem] text-slate-400 font-medium">
        <svg class="w-3.5 h-3.5 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
        <%= sy-datum+6(2) %>.<%= sy-datum+4(2) %>.<%= sy-datum(4) %>
      </div>
      <div class="w-px h-6 bg-slate-200"></div>
      <div class="flex items-center gap-3">
        <div class="text-right">
          <div class="text-xs font-semibold text-slate-700"><%= gv_full_name %></div>
          <div class="text-[0.6rem] text-slate-400"><%= gv_role %></div>
        </div>
        <div class="w-8 h-8 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 text-xs font-bold">
          <% IF gv_full_name IS NOT INITIAL. %><%= gv_full_name(1) %><% ELSE. %>?<% ENDIF. %>
        </div>
        <a href="login.htm" class="px-3 py-1.5 text-xs font-semibold text-slate-500 bg-slate-50 rounded-lg border border-slate-200 hover:bg-slate-100 hover:text-red-600 transition-colors flex items-center gap-1">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
          Logout
        </a>
      </div>
    </div>
  </div>
</div>
