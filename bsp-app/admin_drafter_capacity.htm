<%@page language="abap"%>
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kapasitas Drafter - ECM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans min-h-screen">

    <%@include file="admin_header.htm"%>

    <main class="w-full px-4 sm:px-6 lg:px-8 py-8 pb-24 space-y-6">
        
        <div class="mb-6">
            <h1 class="text-2xl font-extrabold text-slate-800">Kapasitas Drafter</h1>
            <p class="text-sm text-slate-500 mt-1">Pemantauan beban kerja dan jumlah ECR aktif (INWK, BMPR, BMAP, INSP) untuk masing-masing Drafter.</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6 items-start">
            <%= GV_CAPACITY_HTML %>
        </div>

    </main>

    <!-- Modal Daftar Pekerjaan -->
    <div id="listModal" class="fixed inset-0 bg-black/50 z-[9999] hidden items-center justify-center">
        <div class="bg-white rounded-2xl max-w-[600px] w-[95%] max-h-[85vh] overflow-y-auto shadow-2xl flex flex-col">
            <div class="p-5 border-b border-slate-200 flex items-center justify-between bg-emerald-600 rounded-t-2xl">
                <div>
                    <h2 class="text-base font-bold text-white">Daftar ECR Aktif</h2>
                    <p class="text-xs text-emerald-100" id="listModalSubtitle"></p>
                </div>
                <button onclick="closeListModal()" class="w-8 h-8 rounded-full bg-white/20 text-white flex items-center justify-center hover:bg-white/30 transition-all">
                    <span class="text-lg font-bold">&times;</span>
                </button>
            </div>
            <div class="p-5 bg-slate-50 flex-1 overflow-y-auto" id="listModalContent">
                <!-- Injected Content -->
            </div>
        </div>
    </div>

    <script>
        window.GV_USER_ID = '<%= GV_USER_ID %>';
        window.GV_ROLE    = '<%= GV_ROLE %>';

        function openEcrModalList(drafterName, dataId) {
            var dataEl = document.getElementById(dataId);
            if (!dataEl) return;
            
            document.getElementById('listModalSubtitle').textContent = 'Drafter: ' + drafterName;
            document.getElementById('listModalContent').innerHTML = dataEl.innerHTML;
            
            var modal = document.getElementById('listModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeListModal() {
            var modal = document.getElementById('listModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
</body>
</html>
